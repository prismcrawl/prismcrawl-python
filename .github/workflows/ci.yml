name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu 26.04 runners have no Python 3.9 builds.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest brotli
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest mypy ruff brotli
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Generated code matches openapi.json
        run: |
          python scripts/generate.py
          git diff --exit-code -- src/prismcrawl/types.py src/prismcrawl/_resources.py
