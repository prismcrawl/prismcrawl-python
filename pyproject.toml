[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "prismcrawl"
dynamic = ["version"]
description = "Official Python client for the PrismCrawl API: search results, places, app stores, products, and reviews as structured JSON."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PrismCrawl", email = "support@prismcrawl.com" }]
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.23,<1",
  "typing-extensions>=4.7",
]
keywords = ["prismcrawl", "serp", "search", "google", "bing", "scraping", "api", "reviews", "maps"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
html = ["brotli>=1.0"]

[project.urls]
Homepage = "https://www.prismcrawl.com"
Documentation = "https://www.prismcrawl.com/docs"
Repository = "https://github.com/prismcrawl/prismcrawl-python"
Issues = "https://github.com/prismcrawl/prismcrawl-python/issues"
Changelog = "https://github.com/prismcrawl/prismcrawl-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "mypy>=1.10",
  "ruff>=0.6",
  "brotli>=1.0",
]

[tool.hatch.version]
path = "src/prismcrawl/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "examples", "openapi.json", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/prismcrawl"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["src/prismcrawl/types.py", "src/prismcrawl/_resources.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["UP006", "UP007", "UP035", "UP045", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"examples/*" = ["S"]

[tool.mypy]
python_version = "3.10"
files = ["src/prismcrawl", "tests", "examples"]
strict = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["brotli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
